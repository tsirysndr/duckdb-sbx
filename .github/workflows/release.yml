name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release (must match package.json)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  BSDKRUN_NO_AUTO_INSTALL: '1'

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      source-ref: ${{ inputs.tag || github.ref }}

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            target: bun-darwin-arm64
          - platform: linux-x86_64
            target: bun-linux-x64-baseline
          - platform: linux-arm64
            target: bun-linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup-project
      - name: Verify tag and build the release binary
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          BUN_TARGET: ${{ matrix.target }}
        run: node scripts/ci/release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload all binaries to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Check all targets and generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets
          test -f duckdb-sbx-darwin-aarch64.tar.gz
          test -f duckdb-sbx-linux-x86_64.tar.gz
          test -f duckdb-sbx-linux-arm64.tar.gz
          sha256sum duckdb-sbx-*.tar.gz > SHA256SUMS
      - name: Create the release and upload verified build outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.tar.gz release-assets/SHA256SUMS --clobber
